<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Good Ice Cream, Great Ice Cream</title>
  <meta name="theme-color" content="#ff9ebb" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <!-- Top HUD Header -->
    <header id="top-hud">
      <div class="hud-left">
        <div class="hud-item day-badge">DAY <span id="hud-day">1</span></div>
        <div class="hud-item clock-badge">⏰ <span id="hud-time">12:00 PM</span></div>
      </div>
      <div class="shop-title">🍦 Good Ice Cream, Great Ice Cream 🍦</div>
      <div class="hud-right">
        <div class="hud-item money-badge">💵 $<span id="hud-money">50.00</span></div>
        <button id="btn-save-quit" class="save-quit-top-btn" title="Save & Exit to Title">💾 Save & Quit</button>
        <button id="btn-sound" class="icon-btn" title="Toggle Sound">🔊</button>
        <button id="btn-pwa-install" class="pwa-install-btn hidden">📲 Install PWA</button>
      </div>
    </header>

    <!-- Main Game View Container -->
    <main id="game-container">
      <!-- Views will be mounted here dynamically by main.ts -->
    </main>

    <!-- Dev Mode Live Indicator Footer -->
    <footer id="dev-bar">
      <span class="pulse-dot">●</span> DEV MODE LIVE - Vite HMR Active | <button id="dev-skip-day" class="dev-link">Skip to End of Day</button>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
